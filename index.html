<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Tracker</title>
  <link rel="stylesheet" href="public/css/style.css">
</head>
<body>
  <div class="container">
    <h1>Drink Water</h1>
    <p>Goal: 2 Liters</p>
    <div class="glass">
      <div class="water" id="water">
        <span id="percentage"></span>
      </div>
      <span id="remaining-litre" class="remaining-litre">2L</span>
    </div>
    <p>Select how many glasses of water that you have drunk:</p>
    <div class="glasses">
      <div class="row">
        <button class="small-glass" data-amount="250">250 ml</button>
        <button class="small-glass" data-amount="250">250 ml</button>
        <button class="small-glass" data-amount="250">250 ml</button>
        <button class="small-glass" data-amount="250">250 ml</button>
      </div>
      <div class="row">
        <button class="small-glass" data-amount="250">250 ml</button>
        <button class="small-glass" data-amount="250">250 ml</button>
        <button class="small-glass" data-amount="250">250 ml</button>
        <button class="small-glass" data-amount="250">250 ml</button>
      </div>
    </div>
  </div>
  <script src="public/javascript/main.js"></script>
</body>
</html>
